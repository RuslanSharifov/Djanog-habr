<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Məqalə tapılmadı</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 15px;
            color: #333;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="box">
        <h1>Məqalə tapılmadı</h1>

        <p>
            Axtardığınız məqalə mövcud deyil və ya artıq əlçatan deyil.
        </p>

        <a href="{% url 'home' %}" class="back-button">
            Geri qayıt
        </a>
    </div>
</div>

</body>
</html>
