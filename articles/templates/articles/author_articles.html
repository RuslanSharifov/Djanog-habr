{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ author.username }} - DjangoHabr</title>
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
</head>
<body>
<main class="page-container">
    <h1>{{ author.username }}'s Articles</h1>
    <div class="article-list">
        {% for article in articles %}
            <article class="article-item">
                <h2>{{ article.title }}</h2>
                <p>{{ article.text|truncatewords:30 }}</p>
            </article>
        {% empty %}
            <div class="empty-state"><p>No articles.</p></div>
        {% endfor %}
    </div>
    <a class="back-link" href="{% url 'authors' %}">Back to Authors</a>
</main>
</body>
</html>
