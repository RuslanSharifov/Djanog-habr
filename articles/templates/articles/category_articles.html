{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} - DjangoHabr</title>
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
</head>
<body>
<main class="page-container">
    <h1>{{ category.name }}</h1>
    <div class="article-list">
        {% for article in articles %}
            <article class="article-item">
                <h2>{{ article.title }}</h2>
                <p>{{ article.text|truncatewords:30 }}</p>
            </article>
        {% empty %}
            <div class="empty-state"><p>No articles in this category.</p></div>
        {% endfor %}
    </div>
    <a class="back-link" href="{% url 'categories' %}">Back to Categories</a>
</main>
</body>
</html>
