<div class="article-actions">

    <form method="post" action="{% url 'article_like' article.id %}">
        {% csrf_token %}
        <button type="submit" class="action-button like-button">
            ❤️ Like
        </button>
    </form>

    <form method="post" action="{% url 'article_dislike' article.id %}">
        {% csrf_token %}
        <button type="submit" class="action-button dislike-button">
            👎 Dislike
        </button>
    </form>

</div>
